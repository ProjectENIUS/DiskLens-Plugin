# DiskLens — English messages.
# Placeholders in {braces} are filled in by the plugin. Colours are applied by the plugin.
# Missing keys are added automatically on update; your edits are kept.

units: "B, KB, MB, GB, TB, PB"
root-name: "./ (server root)"
counts: "{files} files, {dirs} folders"
