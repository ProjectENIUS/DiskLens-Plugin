export-copy-hover: "Copy the path"

status-scanning: "A scan is running."
status-idle: "No scan is running."
status-cached: "Cached result from {ago}: {size}, {files} files."
status-empty: "The cache is empty."

help-title: "DiskLens — what takes up disk space"
help-tree: "{cmd} [path] [depth] [topN] [-r] — folder tree by size"
