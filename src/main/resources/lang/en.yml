ago-seconds: "{n} s ago"
ago-minutes: "{n} min ago"
footer: "Scan: {ago}, took {took} s, access errors: {errors}, skipped links: {links}"
footer-plain: "Rescan: {rescan}   Report to file: {export}"

files-title: "Largest files on the server ({shown} of {total}, total {size})"
files-limited: "Only {n} files are kept (largest-files in config.yml)"

no-permission: "You don't have permission (disklens.use)."
config-reloaded: "DiskLens config and languages reloaded."
bad-path: "Invalid path: {path}"
